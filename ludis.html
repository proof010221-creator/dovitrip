<!doctype html>
<html lang="ko">
<head>
  <!-- LUDIS_LUDIS_HTML_REDIRECT_SHIM_V11 적용됨 -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="0; url=ludis/" />
  <title>루디스 이동 중</title>
  <style>
    html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#f4f6fb;color:#111827;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif}
    .box{text-align:center;padding:24px}
    .logo{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,#635bff,#00a2ff);color:white;font-size:30px}
    h1{font-size:22px;margin:0 0 8px}
    p{color:#64748b;margin:0 0 16px;line-height:1.5}
    a{display:inline-flex;text-decoration:none;background:linear-gradient(135deg,#635bff,#00a2ff);color:white;font-weight:900;border-radius:14px;padding:12px 16px}
  </style>
  <script>
    // 예전 파일이 ludis.html로 이동시키는 경우 404를 막고 /ludis/로 넘깁니다.
    (function(){
      try {
        location.replace("ludis/");
      } catch (err) {
        location.href = "ludis/";
      }
    })();
  </script>
</head>
<body>
  <div class="box">
    <div class="logo">🎲</div>
    <h1>루디스로 이동 중입니다.</h1>
    <p>잠시 후 자동으로 메인 화면으로 이동합니다.</p>
    <a href="ludis/">바로 이동</a>
  </div>
</body>
</html>
